name: Deploy to Google Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Ensure directory exists
          if [ ! -d "/opt/road-ready/.git" ]; then
            echo "Repository missing. Cloning fresh..."
            sudo rm -rf /opt/road-ready
            # Use HTTPS for public repo to avoid key issues, OR assume keys are set for SSH
            # Let's use the public HTTPS URL since we know it works for public repos without auth
            # IF your repo is private, we must use git@github.com...
            # Use SSH to clone (uses the Deploy Key on the server)
            sudo git clone git@github.com:doublehm/road-ready.git /opt/road-ready
            sudo chown -R $(whoami) /opt/road-ready
          fi

          cd /opt/road-ready
          
          # Fix permissions to ensure current user can pull
          sudo chown -R $(whoami) .

          # Trust GitHub's SSH Key (Fixes 'Host key verification failed')
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          
          # Switch remote to SSH to ensure auth works
          git remote set-url origin git@github.com:doublehm/road-ready.git
          
          # Pull latest changes
          git fetch origin main
          git reset --hard origin/main
          
          # Stop conflicts
          sudo systemctl stop roadready || true
          sudo systemctl disable roadready || true
          
          # Verify Content
          echo "--- CHECKING TITLE TAG ---"
          grep "<title>" app/templates/base.html
          echo "--------------------------"

          # Rebuild and Restart Docker
          sudo docker compose down
          sudo docker compose up -d --build
          
          # Ensure Nginx is happy
          sudo systemctl restart nginx
          
          echo "Deployment successful!"
