name: Deploy to Google Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "--- GIT DIAGNOSTICS ---"
          cd /opt/road-ready
          
          # Fix permissions first (ensure current user owns the dir)
          # We assume the script runs as a user who can sudo.
          echo "Fixing permissions..."
          sudo chown -R $(whoami) . || echo "Failed to chown, trying as root..."
          
          echo "Current Dir: $(pwd)"
          
          echo "Remote URL:"
          git remote -v || echo "Git remote failed"
          
          echo "Fetching..."
          # specific fetch to ensure we get the latest
          sudo git fetch origin main || echo "Git fetch failed"
          
          echo "Resetting..."
          sudo git reset --hard origin/main || echo "Git reset failed"
          
          echo "Cleaning..."
          sudo git clean -fd || echo "Git clean failed"
          
          echo "Latest Commit on Server:"
          git log -n 1 || echo "Git log failed"
          
          echo "--- FILE CONTENT CHECK ---"
          head -n 10 app/templates/base.html
          echo "--------------------------"
          
          # Continue with build...
          sudo systemctl stop roadready || true
          sudo fuser -k 8000/tcp || true
          sudo docker compose down || true
          sudo docker compose build --no-cache
          sudo docker compose up -d
          sudo systemctl restart nginx
