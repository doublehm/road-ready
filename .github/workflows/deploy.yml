name: Deploy to Google Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/road-ready
          
          # Force clean state
          sudo git fetch origin main
          sudo git reset --hard origin/main
          
          # DEBUG: Check if file updated
          echo "--- CHECKING BASE.HTML ---"
          grep "v2.0" app/templates/base.html || echo "VERSION MARKER NOT FOUND IN FILE!"
          
          # Stop systemd service
          sudo systemctl stop roadready || true
          sudo systemctl disable roadready || true
          
          # Force kill anything on port 8000
          sudo fuser -k 8000/tcp || true
          
          # Prune and Rebuild with NO CACHE
          sudo docker system prune -f || true
          sudo docker compose down || true
          sudo docker compose build --no-cache
          sudo docker compose up -d
          
          sudo systemctl restart nginx
          echo "Deployment successful!"
