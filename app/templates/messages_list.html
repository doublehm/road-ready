{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header ">
                <h4 class="mb-0">My Messages 💬</h4>
            </div>
            <div class="card-body">
                {% if contacts %}
                    <div class="list-group">
                        {% for contact in contacts %}
                        <a href="/messages/{{ contact.id }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-1">{{ contact.full_name }}</h5>
                                <small class="text-muted">{{ contact.role | title }}</small>
                            </div>
                            <i class="bi bi-chevron-right text-muted">></i>
                        </a>
                        {% endfor %}
                    </div>
                {% else %}
                    <div class="text-center py-5">
                        <p class="text-muted">No conversations yet.</p>
                        <p class="small">You can message instructors or students from the dashboard.</p>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
