{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-3">Student Profile</h3>
                <p class="text-muted mb-4">Tell us a bit about yourself to help us find the best match.</p>
                
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form action="/setup-student" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Age</label>
                        <input type="number" name="age" class="form-control" required min="16">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">BC Learner's License Number (7 digits)</label>
                        <input type="text" name="l_license_number" class="form-control" placeholder="1234567" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Upload Photo of 'L' License</label>
                        <input type="file" name="license_image" class="form-control" accept="image/*" required>
                        <div class="form-text">We need this to verify your eligibility to drive.</div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Complete Setup</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
