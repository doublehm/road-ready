{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4">Notifications 🔔</h2>
        
        {% if notifications %}
            <div class="list-group">
                {% for notif in notifications %}
                <a href="#" class="list-group-item list-group-item-action {% if not notif.is_read %}active{% endif %}" aria-current="true">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">{{ notif.title }}</h5>
                        <small>{% if not notif.is_read %}New{% endif %}</small>
                    </div>
                    <p class="mb-1">{{ notif.message }}</p>
                    <small>{{ notif.timestamp }}</small>
                </a>
                {% endfor %}
            </div>
        {% else %}
            <div class="text-center py-5 text-muted">
                <i class="bi bi-bell-slash display-1"></i>
                <p class="mt-3">No notifications yet.</p>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
