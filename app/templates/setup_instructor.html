{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-3">Instructor Verification</h3>
            <p class="text-muted">Tell students about your experience and rates.</p>
            
            <form action="/setup-instructor" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="city" class="form-label">City of Operation</label>
                    <input type="text" class="form-control" id="city" name="city" placeholder="e.g. Vancouver" required>
                </div>
                
                <div class="mb-3">
                    <label for="hourly_rate" class="form-label">Base Hourly Rate ($)</label>
                    <input type="number" class="form-control" id="hourly_rate" name="hourly_rate" min="1" step="0.5" required onchange="updateBaseRate()">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">License Classes Taught</label>
                    <div class="card p-3 bg-light">
                        <div class="row g-3">
                            <!-- Class 5 -->
                            <div class="col-12">
                                <div class="form-check d-flex align-items-center">
                                    <input class="form-check-input me-2 class-check" type="checkbox" value="Class 5" id="c5" onchange="togglePrice('c5')">
                                    <label class="form-check-label flex-grow-1" for="c5">Class 5 (Full License)</label>
                                    <input type="number" class="form-control form-control-sm class-price" id="price-c5" placeholder="Rate" style="width: 100px; display: none;" step="0.5">
                                </div>
                            </div>
                            <!-- Class 7 -->
                            <div class="col-12">
                                <div class="form-check d-flex align-items-center">
                                    <input class="form-check-input me-2 class-check" type="checkbox" value="Class 7" id="c7" onchange="togglePrice('c7')">
                                    <label class="form-check-label flex-grow-1" for="c7">Class 7 (Novice)</label>
                                    <input type="number" class="form-control form-control-sm class-price" id="price-c7" placeholder="Rate" style="width: 100px; display: none;" step="0.5">
                                </div>
                            </div>
                            <!-- Class 4 -->
                            <div class="col-12">
                                <div class="form-check d-flex align-items-center">
                                    <input class="form-check-input me-2 class-check" type="checkbox" value="Class 4" id="c4" onchange="togglePrice('c4')">
                                    <label class="form-check-label flex-grow-1" for="c4">Class 4 (Restricted/Unrestricted)</label>
                                    <input type="number" class="form-control form-control-sm class-price" id="price-c4" placeholder="Rate" style="width: 100px; display: none;" step="0.5">
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" name="license_classes" id="license_classes_json">
                </div>
                
                <script>
                    function togglePrice(id) {
                        const check = document.getElementById(id);
                        const input = document.getElementById('price-' + id);
                        const baseRate = document.getElementById('hourly_rate').value;
                        
                        if (check.checked) {
                            input.style.display = 'block';
                            if (!input.value) input.value = baseRate;
                            input.setAttribute('required', 'required');
                        } else {
                            input.style.display = 'none';
                            input.removeAttribute('required');
                        }
                    }

                    function updateBaseRate() {
                        const base = document.getElementById('hourly_rate').value;
                        document.querySelectorAll('.class-price').forEach(input => {
                            if (input.style.display !== 'none' && !input.value) {
                                input.value = base;
                            }
                        });
                    }

                    document.querySelector('form').addEventListener('submit', function(e) {
                        const classes = [];
                        const ids = ['c5', 'c7', 'c4'];
                        
                        ids.forEach(id => {
                            const check = document.getElementById(id);
                            if (check.checked) {
                                const price = document.getElementById('price-' + id).value;
                                classes.push({
                                    license_class: check.value,
                                    price: parseFloat(price)
                                });
                            }
                        });
                        
                        document.getElementById('license_classes_json').value = JSON.stringify(classes);
                    });
                </script>
                
                <div class="mb-3">
                    <label for="bio" class="form-label">Bio / Experience</label>
                    <textarea class="form-control" id="bio" name="bio" rows="3" placeholder="I have 10 years of experience..." required></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="car_model" class="form-label">Car Model</label>
                        <input type="text" class="form-control" id="car_model" name="car_model" placeholder="e.g. 2020 Toyota Corolla" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="certification_id" class="form-label">Instructor License ID</label>
                        <input type="text" class="form-control" id="certification_id" name="certification_id" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="insurance_policy" class="form-label">Insurance Policy Number</label>
                    <input type="text" class="form-control" id="insurance_policy" name="insurance_policy" required>
                </div>

                <div class="mb-4">
                    <label for="license_image" class="form-label">Upload Instructor License (Photo/Scan)</label>
                    <input type="file" class="form-control" id="license_image" name="license_image" accept="image/*,.pdf" required>
                </div>

                <div class="mb-4">
                    <label for="insurance_image" class="form-label">Upload Insurance Document (Photo/Scan)</label>
                    <input type="file" class="form-control" id="insurance_image" name="insurance_image" accept="image/*,.pdf" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Complete Setup</button>
                </div>
            </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
