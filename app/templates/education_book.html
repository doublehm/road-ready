{% extends "base.html" %}

{% block content %}
<style>
    /* Reset main container padding for full screen experience */
    .container {
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
    }
    
    body {
        overflow-x: hidden;
        background-color: #333;
    }

    #book-viewer-container {
        position: relative;
        width: 100vw;
        height: calc(100vh - 56px); /* Subtract navbar height */
        background-color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    #pdf-render-canvas {
        max-width: 100%;
        max-height: 100%;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        transition: transform 0.2s ease;
    }

    /* Controls Overlay */
    .controls-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 15px;
        transform: translateY(100%);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 1000;
    }

    /* Show controls on hover or tap */
    #book-viewer-container:hover .controls-overlay,
    #book-viewer-container.show-controls .controls-overlay {
        transform: translateY(0);
    }

    /* Range Slider */
    input[type=range] {
        width: 100%;
        margin: 10px 0;
        cursor: pointer;
    }

    /* Click Zones for Desktop (Invisible) */
    .click-zone {
        position: absolute;
        top: 0;
        bottom: 50px; /* Leave space for controls */
        width: 20%;
        z-index: 900;
        cursor: pointer;
    }
    #prev-zone { left: 0; }
    #next-zone { right: 0; }
    
    /* Loading Spinner */
    #loading-indicator {
        position: absolute;
        color: white;
        z-index: 100;
    }

    /* Page info pill */
    .page-pill {
        background: rgba(0,0,0,0.6);
        color: white;
        padding: 5px 15px;
        border-radius: 20px;
        position: absolute;
        top: 20px;
        z-index: 100;
        font-size: 0.9rem;
    }
</style>

<div id="book-viewer-container">
    <div id="loading-indicator">
        <div class="spinner-border" role="status"></div>
        <div class="mt-2">Loading Book...</div>
    </div>
    
    <div class="page-pill">
        Page <span id="current-page">1</span> / <span id="total-pages">--</span>
    </div>

    <!-- Click zones for easy navigation on desktop -->
    <div id="prev-zone" class="click-zone" title="Previous Page"></div>
    <div id="next-zone" class="click-zone" title="Next Page"></div>

    <canvas id="pdf-render-canvas"></canvas>

    <!-- Bottom Controls -->
    <div class="controls-overlay" id="controls">
        <div class="d-flex justify-content-between w-100 mb-2 px-2">
            <span id="page-indicator-text">Page 1</span>
            <span>
                <i class="bi bi-arrow-left-circle fs-4 mx-2" id="btn-prev" style="cursor:pointer"></i>
                <i class="bi bi-arrow-right-circle fs-4 mx-2" id="btn-next" style="cursor:pointer"></i>
            </span>
        </div>
        <input type="range" class="form-range" id="page-slider" min="1" max="100" value="1">
    </div>
</div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const state = {
        pdfDoc: null,
        pageNum: 1,
        pageRendering: false,
        pageNumPending: null,
        scale: 1.0, // Initial scale, will be calculated
        canvas: document.getElementById('pdf-render-canvas'),
        ctx: document.getElementById('pdf-render-canvas').getContext('2d'),
        touchStartX: 0,
        touchEndX: 0
    };

    const els = {
        container: document.getElementById('book-viewer-container'),
        slider: document.getElementById('page-slider'),
        currentPage: document.getElementById('current-page'),
        totalPages: document.getElementById('total-pages'),
        pageIndicatorText: document.getElementById('page-indicator-text'),
        loader: document.getElementById('loading-indicator'),
        controls: document.getElementById('controls')
    };

    // --- Render Logic ---
    function renderPage(num) {
        state.pageRendering = true;
        
        // Fetch page
        state.pdfDoc.getPage(num).then(function(page) {
            
            // Calculate scale to fit best in container
            const containerWidth = els.container.clientWidth;
            const containerHeight = els.container.clientHeight;
            
            const unscaledViewport = page.getViewport({scale: 1});
            const scaleX = containerWidth / unscaledViewport.width;
            const scaleY = containerHeight / unscaledViewport.height;
            
            // Use the smaller scale to fit entire page
            state.scale = Math.min(scaleX, scaleY) * 0.95; // 95% to leave a tiny margin

            const viewport = page.getViewport({scale: state.scale});
            state.canvas.height = viewport.height;
            state.canvas.width = viewport.width;

            const renderContext = {
                canvasContext: state.ctx,
                viewport: viewport
            };
            
            const renderTask = page.render(renderContext);

            renderTask.promise.then(function() {
                state.pageRendering = false;
                els.loader.style.display = 'none';
                
                if (state.pageNumPending !== null) {
                    renderPage(state.pageNumPending);
                    state.pageNumPending = null;
                }
            });
        });

        // Update UI
        els.currentPage.textContent = num;
        els.slider.value = num;
        els.pageIndicatorText.textContent = `Page ${num}`;
    }

    function queueRenderPage(num) {
        if (state.pageRendering) {
            state.pageNumPending = num;
        } else {
            renderPage(num);
        }
    }

    function onPrevPage() {
        if (state.pageNum <= 1) return;
        state.pageNum--;
        queueRenderPage(state.pageNum);
    }

    function onNextPage() {
        if (state.pageNum >= state.pdfDoc.numPages) return;
        state.pageNum++;
        queueRenderPage(state.pageNum);
    }

    // --- Interaction Listeners ---
    
    // Slider
    els.slider.addEventListener('input', (e) => {
        state.pageNum = parseInt(e.target.value);
        queueRenderPage(state.pageNum);
    });

    // Click Zones
    document.getElementById('prev-zone').addEventListener('click', onPrevPage);
    document.getElementById('next-zone').addEventListener('click', onNextPage);
    document.getElementById('btn-prev').addEventListener('click', onPrevPage);
    document.getElementById('btn-next').addEventListener('click', onNextPage);

    // Touch / Swipe Logic
    els.container.addEventListener('touchstart', e => {
        state.touchStartX = e.changedTouches[0].screenX;
        // Show controls on touch
        els.container.classList.add('show-controls');
        // Hide after 3s
        clearTimeout(window.controlsTimeout);
        window.controlsTimeout = setTimeout(() => {
            els.container.classList.remove('show-controls');
        }, 3000);
    });

    els.container.addEventListener('touchend', e => {
        state.touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    });

    function handleSwipe() {
        const threshold = 50; // min distance
        if (state.touchEndX < state.touchStartX - threshold) {
            // Swipe Left -> Next Page
            onNextPage();
        }
        if (state.touchEndX > state.touchStartX + threshold) {
            // Swipe Right -> Prev Page
            onPrevPage();
        }
    }
    
    // Resize Handler
    window.addEventListener('resize', () => {
        // Re-render to fit new dimensions
        if(state.pdfDoc) {
            renderPage(state.pageNum);
        }
    });

    // --- Load Document ---
    const url = '/static/driver-full.pdf';
    
    pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
        state.pdfDoc = pdfDoc_;
        els.totalPages.textContent = state.pdfDoc.numPages;
        els.slider.max = state.pdfDoc.numPages;

        renderPage(state.pageNum);
    }).catch(err => {
        console.error("Error loading PDF", err);
        els.loader.innerHTML = "<div class='text-danger'>Error loading book.</div>";
    });

</script>
{% endblock %}
