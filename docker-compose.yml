version: '3.8'

services:
  web:
    build: .
    container_name: roadready_app
    restart: always
    ports:
      - "10.66.66.2:8000:8000"
    volumes:
      # Persist the SQLite database file
      - ./roadready.db:/app/roadready.db
      # Persist user uploads (license images)
      - ./app/static/uploads:/app/app/static/uploads
      # Live-mount source code so uvicorn --reload picks up changes instantly
      - ./app:/app/app
    environment:
      - DATABASE_URL=sqlite:///./roadready.db
      - MONGODB_URL=mongodb://mongodb:27017/roadready
      # Add your Stripe keys here later, e.g.:
      # - STRIPE_API_KEY=sk_test_...
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=5)"]
      interval: 30s   # check every 30 seconds
      timeout: 10s    # fail if no response in 10s
      retries: 3      # mark unhealthy after 3 consecutive failures
      start_period: 20s # give the app time to start before first check

  mongodb:
    image: mongo:latest
    container_name: roadready_mongodb
    restart: always
    ports:
      - "10.66.66.2:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mongodb_data:
